start_mapping_run:
  target:
    entity:
      integration: openneato
      domain: vacuum

save_floor_plan:
  target:
    entity:
      integration: openneato
      domain: vacuum
  fields:
    name:
      example: Ground floor
      selector:
        text:

restore_floor_plan:
  target:
    entity:
      integration: openneato
      domain: vacuum
  fields:
    name:
      required: true
      example: Ground floor
      selector:
        text:

delete_floor_plan:
  target:
    entity:
      integration: openneato
      domain: vacuum
  fields:
    name:
      required: true
      example: Ground floor
      selector:
        text:

reset_floor_plan:
  target:
    entity:
      integration: openneato
      domain: vacuum

manual_move:
  target:
    entity:
      integration: openneato
      domain: vacuum
  fields:
    left_mm:
      required: true
      example: 300
      selector:
        number:
          min: -10000
          max: 10000
          unit_of_measurement: mm
    right_mm:
      required: true
      example: 300
      selector:
        number:
          min: -10000
          max: 10000
          unit_of_measurement: mm
    speed:
      default: 150
      selector:
        number:
          min: 0
          max: 350
          unit_of_measurement: mm/s
