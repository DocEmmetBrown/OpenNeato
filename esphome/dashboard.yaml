# OpenNeato dashboard for the ESPHome firmware.
#
# Settings > Dashboards > Add dashboard > New dashboard from scratch, open it,
# then the pencil > three dots > Raw configuration editor, and paste this file.
#
# Entity IDs assume the prefix "neato" (vacuum.neato, sensor.neato_battery, ...).
# Home Assistant derives it from the device name, and recent versions put the
# area first (e.g. "bureau_neato"). Look up the prefix of your Neato entities
# (Settings > Entities) and replace every ".neato" with ".<prefix>", e.g.
# ".neato" -> ".bureau_neato". Every ".neato" below is an entity ID, so a plain
# find-and-replace is safe. Needs the OpenNeato integration (vacuum, map card).
views:
- title: Neato
  path: neato
  icon: mdi:robot-vacuum
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: sensor.neato_activity
    show_name: false
  - type: entity
    entity: sensor.neato_battery
    show_name: false
  - type: entity
    entity: binary_sensor.neato_robot_connected
    show_name: true
    name: Robot
  - type: entity
    entity: sensor.neato_error_message
    show_name: false
    visibility:
    - condition: state
      entity: binary_sensor.neato_problem
      state: 'on'
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:openneato-card
      entity: vacuum.neato
      expanded: true
      state_content:
      - state
      - charging
      - battery
      - error_message
      features:
      - type: custom:openneato-replay
        height: 420
      - type: custom:openneato-controls
        items:
        - start
        - pause
        - stop
        - dock
        - spot
        - locate
        - explore
      - type: custom:openneato-suction
        fan_speeds:
        - eco
        - normal
        - intense
      - type: custom:openneato-configuration
        items:
        - navigation_mode
        - stealth_led
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Clean
      icon: mdi:robot-vacuum
    - type: tile
      entity: button.neato_start_house_clean
      name: House
      icon: mdi:play
      hide_state: true
      vertical: true
      tap_action: &id001
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_start_house_clean
      icon_tap_action: *id001
      grid_options:
        columns: 4
        rows: 2
      color: green
    - type: tile
      entity: button.neato_start_spot_clean
      name: Spot
      icon: mdi:target
      hide_state: true
      vertical: true
      tap_action: &id002
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_start_spot_clean
      icon_tap_action: *id002
      grid_options:
        columns: 4
        rows: 2
      color: green
    - type: tile
      entity: button.neato_pause
      name: Pause
      icon: mdi:pause
      hide_state: true
      vertical: true
      tap_action: &id003
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_pause
      icon_tap_action: *id003
      grid_options:
        columns: 4
        rows: 2
      color: amber
    - type: tile
      entity: button.neato_stop
      name: Stop
      icon: mdi:stop
      hide_state: true
      vertical: true
      tap_action: &id004
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_stop
      icon_tap_action: *id004
      grid_options:
        columns: 4
        rows: 2
      color: red
    - type: tile
      entity: button.neato_return_to_base
      name: Dock
      icon: mdi:home-import-outline
      hide_state: true
      vertical: true
      tap_action: &id005
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_return_to_base
      icon_tap_action: *id005
      grid_options:
        columns: 4
        rows: 2
      color: blue
    - type: tile
      entity: button.neato_locate
      name: Locate
      icon: mdi:map-marker-question
      hide_state: true
      vertical: true
      tap_action: &id006
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_locate
      icon_tap_action: *id006
      grid_options:
        columns: 4
        rows: 2
    - type: tile
      entity: select.neato_navigation_mode
      name: Navigation mode
      features:
      - type: select-options
      grid_options:
        columns: 12
    - type: tile
      entity: switch.neato_eco_mode
      name: Eco mode
      features:
      - type: toggle
      grid_options:
        columns: 6
    - type: tile
      entity: switch.neato_intense_clean
      name: Intense clean
      features:
      - type: toggle
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Floor plan
      icon: mdi:floor-plan
    - type: tile
      entity: button.neato_start_mapping_run
      name: Mapping run
      icon: mdi:map-search
      hide_state: true
      vertical: true
      tap_action: &id007
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_start_mapping_run
        confirmation:
          text: Start a mapping run? The robot explores the whole floor without cleaning; the floor plan is saved when it
            is done.
      icon_tap_action: *id007
      grid_options:
        columns: 4
        rows: 2
      color: purple
    - type: tile
      entity: button.neato_save_floor_plan
      name: Save
      icon: mdi:content-save-outline
      hide_state: true
      vertical: true
      tap_action: &id008
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_save_floor_plan
      icon_tap_action: *id008
      grid_options:
        columns: 4
        rows: 2
    - type: tile
      entity: button.neato_reset_floor_plan
      name: Reset
      icon: mdi:map-marker-off-outline
      hide_state: true
      vertical: true
      tap_action: &id009
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_reset_floor_plan
        confirmation:
          text: Start the floor plan again from scratch? Saved floor plans are kept.
      icon_tap_action: *id009
      grid_options:
        columns: 4
        rows: 2
      color: red
    - type: tile
      entity: select.neato_floor_plan
      name: Saved floor plans
      features:
      - type: select-options
      grid_options:
        columns: 12
    - type: tile
      entity: switch.neato_learn_floor_plan_from_cleans
      name: Learn from cleans
      features:
      - type: toggle
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:information-outline
    - type: tile
      entity: sensor.neato_activity
      name: Activity
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_battery
      name: Battery
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.neato_charging
      name: Charging
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.neato_dustbin
      name: Dust bin
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_next_clean
      name: Next clean
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.neato_error_message
      name: Message
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: sensor.neato_error_message
        state_not: ''
    - type: tile
      entity: button.neato_clear_errors
      name: Clear errors
      icon: mdi:alert-remove
      hide_state: true
      vertical: true
      tap_action: &id010
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.neato_clear_errors
      icon_tap_action: *id010
      grid_options:
        columns: 4
        rows: 2
      color: red
  - type: grid
    cards:
    - type: heading
      heading: Last clean
      icon: mdi:history
    - type: tile
      entity: sensor.neato_clean_started
      name: Started
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.neato_clean_duration
      name: Duration
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_clean_area
      name: Area
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_clean_distance
      name: Distance
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_clean_battery_used
      name: Battery used
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_clean_recharges
      name: Recharges
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.neato_total_cleaning_time
      name: Total cleaning
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Events
      icon: mdi:bell-outline
    - type: logbook
      target:
        entity_id:
        - event.neato_robot_event
        - sensor.neato_activity
        - sensor.neato_error_message
      hours_to_show: 48
      grid_options:
        columns: 12
        rows: 6
