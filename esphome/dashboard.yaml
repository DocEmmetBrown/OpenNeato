- title: Manual drive
  path: neato-manual
  icon: mdi:gamepad-variant
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Manual mode
      icon: mdi:gamepad-variant
    - type: tile
      entity: switch.neato_manual_mode
      name: Manual mode
      features:
      - type: toggle
      grid_options:
        columns: 12
    - type: markdown
      grid_options:
        columns: 12
      content: Turn **Manual mode** on first. Each press drives one short step; the robot stops on its own after 5 s without
        a command, on a bumper hit, a lifted wheel or a stall.
    - type: tile
      entity: switch.neato_manual_brush
      name: Brush
      features:
      - type: toggle
      grid_options:
        columns: 4
    - type: tile
      entity: switch.neato_manual_vacuum
      name: Vacuum
      features:
      - type: toggle
      grid_options:
        columns: 4
    - type: tile
      entity: switch.neato_manual_side_brush
      name: Side brush
      features:
      - type: toggle
      grid_options:
        columns: 4
  - type: grid
    cards:
    - type: heading
      heading: Drive
      icon: mdi:steering
    - type: conditional
      conditions:
      - condition: state
        entity: switch.neato_manual_mode
        state: 'on'
      card:
        type: grid
        columns: 3
        square: true
        cards:
        - type: button
          name: Left
          icon: mdi:rotate-left
          show_state: false
          tap_action: &id019
            action: perform-action
            perform_action: openneato.manual_move
            data:
              left_mm: -100
              right_mm: 100
              speed: 150
            target:
              entity_id: vacuum.neato
          hold_action: *id019
          grid_options:
            columns: 4
            rows: 2
        - type: button
          name: Forward
          icon: mdi:arrow-up-bold
          show_state: false
          tap_action: &id020
            action: perform-action
            perform_action: openneato.manual_move
            data:
              left_mm: 300
              right_mm: 300
